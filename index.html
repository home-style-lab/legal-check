<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法律相談・減額診断ナビ</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f7fa; color: #333; margin: 0; padding: 16px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: #ffffff; border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h1 { font-size: 1.25rem; text-align: center; color: #1e293b; line-height: 1.5; margin-top: 0; margin-bottom: 20px; }
    .btn { display: block; width: 100%; padding: 16px; margin-bottom: 12px; background: #e2e8f0; border: 2px solid transparent; border-radius: 12px; font-size: 1rem; font-weight: 600; color: #334155; text-align: center; cursor: pointer; text-decoration: none; transition: all 0.2s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #2563eb; color: #ffffff; margin-top: 10px; }
    .btn-action { background: #059669; color: #ffffff; font-size: 1.1rem; padding: 18px; text-decoration: none; display: inline-block; margin-top: 16px; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
    .hidden { display: none; }
    .badge { display: inline-block; background: #eff6ff; color: #2563eb; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; }
    .desc { font-size: 0.95rem; line-height: 1.6; color: #475569; margin-bottom: 20px; text-align: left; }
    .result-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; text-align: center; margin-top: 10px; }
    .office-title { font-size: 1.2rem; font-weight: bold; color: #0f172a; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <!-- 0. スタート画面 -->
  <div id="screen-start" style="text-align: center;">
    <span class="badge">無料・匿名・約1分</span>
    <h1>あなたに最適な<br>「法律相談窓口」スピード診断</h1>
    <p class="desc" style="text-align: center;">秘密厳守で誰にもバレずに相談可能。<br>いくつかの簡単な質問に答えるだけで、最適な専門機関をご案内します。</p>
    <button class="btn btn-primary btn-action" onclick="goTo('screen-q1')">診断をはじめる ➔</button>
  </div>

  <!-- 1. Q1 相談内容 -->
  <div id="screen-q1" class="hidden">
    <span class="badge">質問 1 / 3</span>
    <h1>一番解決したい悩みは？</h1>
    <button class="btn" onclick="setAnswer('earth')">毎月の返済額・借金を減らしたい</button>
    <button class="btn" onclick="setAnswer('elife')">家族や職場に絶対にバレたくない</button>
    <button class="btn" onclick="setAnswer('histoire')">闇金や違法業者のトラブル・急を要する相談</button>
  </div>

  <!-- 2. Q2 状況 -->
  <div id="screen-q2" class="hidden">
    <span class="badge">質問 2 / 3</span>
    <h1>ご自身の現在の状況は？</h1>
    <button class="btn" onclick="nextQ2('earth')">複数の業者から借入がある</button>
    <button class="btn" onclick="nextQ2('elife')">スマホ完結でコッソリ進めたい</button>
    <button class="btn" onclick="nextQ2('histoire')">督促が止まらず精神的に追い詰められている</button>
  </div>

  <!-- 3. Q3 重視すること -->
  <div id="screen-q3" class="hidden">
    <span class="badge">質問 3 / 3</span>
    <h1>相談先に一番求めるものは？</h1>
    <button class="btn" onclick="showResult('earth')">豊富な実績と丁寧なサポート</button>
    <button class="btn" onclick="showResult('elife')">徹底したプライバシー保護・手軽さ</button>
    <button class="btn" onclick="showResult('histoire')">即日対応・強い交渉力</button>
  </div>

  <!-- 4. 診断結果画面 -->
  <div id="screen-result" class="hidden">
    <span class="badge">診断完了</span>
    <h1>あなたにピッタリの相談窓口</h1>
    
    <div class="result-box">
      <div id="office-name" class="office-title"></div>
      <p id="office-desc" class="desc"></p>
      <a id="affiliate-link" class="btn btn-action" href="#" target="_blank">無料相談はこちら（公式サイト）</a>
    </div>

    <button class="btn" style="margin-top: 20px; background: transparent; color: #64748b;" onclick="resetQuiz()">↺ もう一度診断する</button>
  </div>
</div>

<script>
  let selectedCategory = 'earth';

  function goTo(screenId) {
    document.querySelectorAll('.container > div').forEach(el => el.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
  }

  function setAnswer(cat) {
    selectedCategory = cat;
    goTo('screen-q2');
  }

  function nextQ2(cat) {
    // Q1とQ2の回答から優先度を微調整（必要に応じてロジック更新可）
    selectedCategory = cat;
    goTo('screen-q3');
  }

  function showResult(cat) {
    // Q3の選択を反映
    let best = cat || selectedCategory;

    const name = document.getElementById('office-name');
    const desc = document.getElementById('office-desc');
    const link = document.getElementById('affiliate-link');

    /* ★ アフィリエイトURLの設定箇所 */
    if (best === 'earth') {
      name.innerText = "推奨窓口：アース法律事務所";
      desc.innerHTML = "丁寧なヒアリングと実績に定評がある法律事務所です。個別の状況に応じた最適な再建プランを提示します。";
      link.href = "YOUR_EARTH_AFFILIATE_URL_HERE"; // ←ここをご自身のアースのアフィリンクに変更
    } else if (best === 'elife') {
      name.innerText = "推奨窓口：イーライフ";
      desc.innerHTML = "プライバシー保護体制が強みです。周囲への発覚を防ぎ、スマートフォンからスムーズな手続きを行えます。";
      link.href = "YOUR_ELIFE_AFFILIATE_URL_HERE"; // ←ここをご自身のイーライフのアフィリンクに変更
    } else {
      name.innerText = "推奨窓口：イストワール";
      desc.innerHTML = "緊急度の高いトラブルや迅速な介入を要する案件において、極めて高い対応能力を有する窓口です。";
      link.href = "YOUR_HISTOIRE_AFFILIATE_URL_HERE"; // ←ここをご自身のイストワールのアフィリンクに変更
    }

    goTo('screen-result');
  }

  function resetQuiz() {
    selectedCategory = 'earth';
    goTo('screen-start');
  }
</script>

</body>
</html>
